name: CI

on:
  push:
  pull_request:

# Cancel any in-flight run on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Collectify.slnx

      - name: Build
        run: dotnet build Collectify.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  docker:
    name: Docker entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test entrypoint
        run: ./scripts/test-docker-entrypoint.sh

  client:
    name: Client (Vite/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  postgres:
    name: Postgres smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: collectify
          POSTGRES_USER: collectify
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      Collectify__Database__Provider: postgres
      Collectify__Database__ConnectionString: >-
        Host=localhost;Port=5432;Database=collectify;Username=collectify;Password=secret
      ASPNETCORE_URLS: http://+:5041
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/server/Collectify.slnx --configuration Release

      - name: Run app (background)
        run: |
          dotnet run --project src/server/Collectify.Api --no-build --configuration Release &
          sleep 10

      - name: Smoke test
        run: |
          curl -fsS http://localhost:5041/api/health
          echo "\nPostgres smoke passed"
