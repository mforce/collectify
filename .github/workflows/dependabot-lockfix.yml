# Repair Dependabot NuGet PRs (#224), ported from mforce/cluckwork#203.
#
# A Dependabot NuGet group PR arrives broken in two ways:
#   - it regenerates only some packages.lock.json files, so CI's `--locked-mode`
#     restore fails with NU1004 on the rest;
#   - it adds a `PackageReference` to a project that only gets the package
#     transitively (its updater pins it that way under central package
#     management). Versions live in Directory.Packages.props, so a bump never
#     needs a csproj edit.
# This reverts every csproj Dependabot modified to the merge base, regenerates
# every lock, and pushes the result to the PR branch.
#
# SECURITY MODEL (as in cluckwork's
# docs/superpowers/specs/2026-07-25-dependabot-lockfix-design.md):
#   - `on: workflow_run` runs the DEFAULT-branch copy of this file, so the PR
#     cannot change what executes.
#   - `compute` runs the untrusted restore with NO credentials; `commit` holds
#     the write token and runs no project code, only scripts from the default
#     branch. A restore-time exploit has no token to steal and no push rights.
#   - The push uses a GitHub App token, not GITHUB_TOKEN: a GITHUB_TOKEN push
#     does not re-trigger CI, so the PR would never go green. The App identity
#     is not dependabot[bot], so the re-triggered CI is gated out (no loop).
#
# INERT UNTIL MERGED, and fails closed until the RELEASE_APP_* secrets exist in
# the `app-token` environment.

name: Dependabot lockfix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  # Serialize per branch; never cancel: a cancel mid-push could leave no fix.
  group: lockfix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  compute:
    name: Regenerate lock files (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Provenance gate. Requires BOTH actor and triggering_actor to be Dependabot
    # (a re-run keeps actor but changes triggering_actor), run_attempt == 1, the
    # nuget branch prefix, and a numeric repo-id match (never a fork).
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.run_attempt == 1 &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/nuget/') &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    permissions: {}
    steps:
      - name: Check out the exact commit CI ran on
        uses: actions/checkout@v7
        with:
          # The immutable SHA the gate validated, NOT head_branch (a moving ref
          # that could advance after the gate passed).
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          # History for the merge base with the default branch.
          fetch-depth: 0

      - name: Revert csproj edits to the merge base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          git diff -z --name-only --diff-filter=M "$base" HEAD -- 'src/server/*.csproj' \
            | xargs -0 -r git checkout "$base" --

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          # No cache: a privileged workflow_run reading a PR-populated cache is a
          # documented poisoning surface, and this job restores fresh anyway.
          cache: false

      - name: Regenerate every lock file
        env:
          # Restore into a throwaway dir, not the shared global cache.
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: >-
          dotnet restore src/server/Collectify.slnx --force-evaluate
          --configfile .github/nuget.lockfix.config

      # Staged under their repo-relative paths, which lockfix-apply.sh reads back.
      - name: Stage the allowlisted lock files
        run: |
          node .github/scripts/lockfix.mjs --list | while IFS= read -r p; do
            install -D -m 644 "$p" "$RUNNER_TEMP/locks/$p"
          done

      - name: Upload the regenerated lock files
        uses: actions/upload-artifact@v7
        with:
          name: lockfiles
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/locks

  commit:
    name: Commit and push the repaired PR
    needs: compute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App secrets live in the `app-token` environment, limited to main.
    # workflow_run sets GITHUB_REF to the default branch, so the rule admits
    # this job whatever the Dependabot branch is called. `deployment: false`
    # keeps the branch policy without a deployment record.
    environment:
      name: app-token
      deployment: false
    permissions:
      contents: write
    steps:
      # The classifier and the allowlist must come from TRUSTED code, never the
      # PR checkout (which a PR could have replaced). Default branch only.
      - name: Check out trusted tooling (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Mint a short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The same App backs release-please, which needs pull-requests and
          # issues write. This caps the token this job holds at contents only.
          # It does not cap the private key, which can mint the App's full
          # grant; what keeps this job safe is that it runs no PR-controlled
          # code.
          permission-contents: write

      - name: Check out the PR head for pushing
        uses: actions/checkout@v7
        with:
          # Same immutable SHA as compute. A commit built on it fast-forwards
          # only if the branch tip still equals it (the non-forced push below).
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.app.outputs.token }}
          path: pr
          fetch-depth: 0

      - name: Download the regenerated lock files
        uses: actions/download-artifact@v8
        with:
          name: lockfiles
          path: ${{ runner.temp }}/locks

      - name: Revert csproj edits, apply locks, classify, and push
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/locks
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash trusted/.github/scripts/lockfix-apply.sh
