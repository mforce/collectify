# Dependabot version updates (#114).
#
# How this relates to the CI gates: they do different halves of the job.
#   - The gates in ci.yml ENFORCE — a known-vulnerable dependency fails the
#     build, so it cannot be ignored or merged past.
#   - Dependabot PROPOSES — it opens the PR that actually fixes what the gate is
#     blocking on, and (with Dependabot alerts enabled in repo settings) flags a
#     newly published advisory the day it lands rather than whenever someone next
#     opens a PR.
# Neither replaces the other: without the gates a vulnerable dep still merges
# green; without Dependabot someone hand-writes every bump.
#
# Updates are GROUPED so routine version churn arrives as a few reviewable PRs
# rather than one per package. Security fixes are deliberately left OUT of the
# groups (Dependabot's default): an advisory fix should arrive as its own PR that
# can be read and merged on its own, not buried in a bulk bump.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/src/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(client)"
    groups:
      # Build/test tooling churns fastest and never reaches a user's browser —
      # keep it out of the way of runtime dependency review.
      dev-tooling:
        patterns: ["*"]
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # The vite/vitest cluster is peer-locked to itself (@vitejs/plugin-react
      # and vitest pin vite ranges), so a SOLO major bump of any one of them is
      # unresolvable — ERESOLVE on npm ci. Majors for the cluster must land as
      # one PR.
      vite-vitest-majors:
        patterns: ["vite", "vitest", "@vitest/*", "@vitejs/*"]
        update-types: ["major"]
      production-minor-patch:
        patterns: ["*"]
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # Finds the projects via Collectify.slnx. Bumps regenerate packages.lock.json,
  # which Dependabot includes in the PR — CI restores with --locked-mode, so a
  # stale lock fails the run rather than silently drifting.
  - package-ecosystem: "nuget"
    directory: "/src/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The root Dockerfile pins its three base images to immutable @sha256 digests
  # (#108), so a rebuild reproduces the exact bytes CI's Trivy scan cleared. A
  # pinned digest never floats, so without this it silently rots past the next
  # base-image security fix. Dependabot opens the digest-bump PR; the Trivy gate
  # in ci.yml then confirms the new base is clean. Grouped so the three bump
  # together as one reviewable PR; security fixes still arrive ungrouped.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-base-images:
        patterns: ["*"]
